services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: digitalrub
      POSTGRES_USER: digitalrub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U digitalrub -d digitalrub"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Database__ApplyMigrations: "true"
      HttpsRedirection__Enabled: "false"
      ConnectionStrings__PostgresConnection: "Host=postgres;Port=5432;Database=digitalrub;Username=digitalrub;Password=${POSTGRES_PASSWORD}"
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  caddy:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data: